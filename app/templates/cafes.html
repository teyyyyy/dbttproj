{% extends "base.html" %}

{% block title %}Cafés - Café Discovery{% endblock %}

{% block content %}
<h1>Cafés</h1>

<div class="mb-4">
    <form class="d-flex" method="get">
        <input type="hidden" name="role" value="{{ current_user.role }}">
        <input class="form-control me-2" type="search" name="search" placeholder="Search cafés..." value="{{ search }}" aria-label="Search">
        <button class="btn btn-outline-success" type="submit">Search</button>
    </form>
</div>

<div class="row">
    {% for cafe in cafes %}
    <div class="col-md-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ cafe.name }}</h5>
                <p class="card-text">{{ cafe.description }}</p>
                <p class="card-text"><small class="text-muted">{{ cafe.address }}</small></p>
                <a href="/cafes/{{ cafe.id }}?role={{ current_user.role }}" class="btn btn-primary">View Details</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% if not cafes %}
<p>No cafés found.</p>
{% endif %}
{% endblock %}
